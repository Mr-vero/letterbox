name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" make dist
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Letterbox.zip
          generate_release_notes: true
